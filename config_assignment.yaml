---
version: "0.5"
assignments:
  assignMPRAworkshop:
    bc_length: 20 ### bc length verified
    BC_rev_comp: false
    linker_length: 31
    alignment_tool:
      split_number: 30
      tool: bbmap
      configs:
        sequence_length: 151 ### length verified
        alignment_start: 1
        min_mapping_quality: 30   #  ~1 in 1000 chance the mapping is wrong
    FW:
      - real_data/assignment/forward/24L005276_S11_L001_R1_001.fastq.gz
    REV:
      - real_data/assignment/reverse/24L005276_S11_L001_R2_001.fastq.gz
    design_file: real_data/assignment/designed_oligos_deduplicated.fasta
    configs:
      default:
        min_support: 3  #  A barcode must appear at least k times across all reads to be considered for assignment.
        fraction: 0.51  #  If a barcode appears 10 times, at least 7 of those must align to the same oligo. (Faye used 0.25 in her pipeline)


