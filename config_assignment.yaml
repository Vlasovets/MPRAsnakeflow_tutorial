---
version: "0.5"
assignments:
  assignMPRAworkshop:
    bc_length: 12                         # 12 bp barcode at start of R1
    BC_rev_comp: false                   # barcodes are NOT reverse complemented (default)
    #linker: GAATTCATCTGGTACCTCG          # inferred linker separating barcode from oligos
    linker_length: 20
    alignment_tool:
      split_number: 30
      tool: exact                        # REQUIRED for embedded barcode + linker mode
      configs:
        sequence_length: 300             # full length of each oligo in design_file
        alignment_start: 1               # align to full oligo (default)
    FW:
      - real_data/assignment/forward/24L005276_S11_L001_R1_001_subset.fastq.gz
    REV:
      - real_data/assignment/reverse/24L005276_S11_L001_R2_001_subset.fastq.gz
    design_file: real_data/assignment/designed_oligos_deduplicated.fasta
    configs:
      default: {}                        # use default filtering unless customizing
